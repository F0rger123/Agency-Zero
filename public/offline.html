<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Agency Zero</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
  main { max-width: 360px; }
  h1 { font-size: 22px; letter-spacing: -0.01em; margin: 24px 0 8px; }
  p { color: #a3a3a3; line-height: 1.6; font-size: 15px; margin: 0 0 24px; }
  a, button { display: inline-block; font: inherit; font-weight: 600; color: #000; background: #fff; border: 0; border-radius: 999px; padding: 12px 22px; text-decoration: none; cursor: pointer; }
  svg { width: 72px; height: 72px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 120 120" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" aria-hidden="true"><ellipse cx="60" cy="60" rx="26" ry="38"/><path d="M42 94L78 26"/></svg>
  <h1>You are offline</h1>
  <p>This page was not saved on this device yet. Pages you have already opened still work, and Lock In keeps running.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
