<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
body{--w:1000px;--h:1250px}
.card{position:absolute;left:150px;top:90px;width:700px;background:#fff;color:#111;box-shadow:0 60px 100px -20px #000,0 0 0 1px #00000022;border-radius:14px;overflow:hidden;transform:perspective(2000px) rotateY(-7deg) rotateX(2deg) rotateZ(1.5deg)}
.hd{display:flex;gap:14px;align-items:center;padding:20px 24px}.av{width:54px;height:54px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px}
.hd b{display:block;font-size:20px}.hd span{font-size:15px;color:#666}
.txt{padding:0 24px 18px;font-size:19px;line-height:1.45}
.cr{position:relative;height:700px;background:radial-gradient(90% 80% at 70% 40%,#222,#070707 70%);overflow:hidden}
.glow{position:absolute;right:120px;top:220px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.6),transparent 68%);filter:blur(8px)}
.drop{position:absolute;right:226px;top:310px;width:136px;height:136px;border-radius:0 50% 50% 50%;transform:rotate(45deg);background:radial-gradient(circle at 62% 38%,#fff,#c4c4c4 40%,#4a4a4a);box-shadow:0 40px 60px rgba(0,0,0,.6),inset -12px -12px 30px rgba(0,0,0,.45)}
.hl{position:absolute;left:34px;bottom:56px;color:#fff;font-size:68px;line-height:.94;letter-spacing:-.05em;font-weight:700;width:420px}
.badge{position:absolute;left:34px;top:34px;color:#fff;font-family:"M";font-size:13px;letter-spacing:.18em;text-transform:uppercase;border:1px solid #ffffff66;padding:8px 12px}
.cta{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:#f0f0ee}
.cta small{display:block;font-size:14px;color:#666}.cta b{font-size:19px}.btn2{background:#dcdcd8;padding:13px 24px;font-weight:600;font-size:17px;border-radius:8px}
.ft{display:flex;gap:40px;padding:14px 24px 18px;color:#666;font-size:16px}
</style></head><body data-w="1000" data-h="1250" data-scale="1.5" data-q="86">
<div class="edit vig"><div class="stage gray"></div>
 <div class="card gray">
  <div class="hd"><div class="av">N</div><div><b>Northline Plumbing &amp; Heating</b><span>Sponsored ·  🌐</span></div></div>
  <div class="txt">Boiler playing up? Same-day callouts, fixed prices and no mess left behind. Book online in two minutes.</div>
  <div class="cr"><div class="rings"></div><div class="glow"></div><div class="drop"></div><div class="badge">Same-day callouts</div><div class="hl">Fixed properly. First time.</div></div>
  <div class="cta"><div><small>northline.co.uk</small><b>Book a callout today</b></div><div class="btn2">Book now</div></div>
  <div class="ft"><span>👍 Like</span><span>💬 Comment</span><span>↗ Share</span></div>
 </div></div></body></html>
